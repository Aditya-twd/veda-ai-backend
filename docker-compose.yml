# Local data stores for development.
#   docker compose up -d      # start mongo + redis
#   docker compose down       # stop
# Then set in .env:
#   MONGODB_URI=mongodb://localhost:27017/vedaai
#   REDIS_URL=redis://localhost:6379
services:
  mongo:
    image: mongo:7
    container_name: vedaai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: vedaai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
